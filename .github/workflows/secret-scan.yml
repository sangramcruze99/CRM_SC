name: Security & Secret Leak Scanner

on:
  push:
    branches: [main, master, staging, develop]
  pull_request:
    branches: [main, master, staging, develop]

jobs:
  secret-scan:
    name: Repository Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Automated Secret Leak Scanner
        run: node scripts/scan-secret-leaks.mjs
