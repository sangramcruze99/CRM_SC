name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "1.8" ]
  pull_request:
    branches: [ "main", "1.8" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/database run generate

      - name: Turborepo Build
        run: pnpm run build
        env:
          NODE_ENV: production
          JWT_SECRET: "ci-test-secret-key-at-least-32-chars-long"

      - name: Typecheck Web Core
        run: pnpm --filter @repo/web-core exec tsc --noEmit

      - name: Lint Codebase
        run: pnpm run lint || true
