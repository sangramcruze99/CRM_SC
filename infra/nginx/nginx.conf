# Business OS — Production Ingress Nginx Configuration
# High-Performance Reverse Proxy with TLS 1.3, Strict Security Headers & Rate Limiting

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Upstream Services (Loopback Only)
    upstream upstream_webcore {
        server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream upstream_gateway {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream upstream_object_storage {
        server 127.0.0.1:9000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream upstream_websocket {
        server 127.0.0.1:3014 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # 1. HTTP Ingress (Port 80) — Mandatory HTTPS Redirection
    server {
        listen 80;
        listen [::]:80;
        server_name localhost *.businessos.local;

        # Redirect all HTTP requests to HTTPS with 301 Moved Permanently
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Ingress (Port 443) — TLS 1.3 Production Reverse Proxy
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost *.businessos.local;

        # TLS Certificates
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        # Strict TLS Protocols & Cipher Suites
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

        # TLS Session Cache
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Mandatory Enterprise Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob: ws: wss:; frame-ancestors 'self';" always;
        add_header X-Ingress-Proxy "BusinessOS-Production-Ingress/1.0" always;

        # Common Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Route A: API Gateway
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://upstream_gateway/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Route B: Auth Rate Limiting
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://upstream_gateway/api/v1/auth/;
        }

        # Route C: Cloud Object Storage (MinIO S3 Vault)
        location /vault/ {
            proxy_pass http://upstream_object_storage/business-os-vault/;
            client_max_body_size 100M;
            proxy_buffering off;
        }

        # Route D: Real-time WebSockets
        location /socket.io/ {
            proxy_pass http://upstream_websocket;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Route E: Next.js Web-Core (App Router & Static Assets)
        location / {
            proxy_pass http://upstream_webcore;
            client_max_body_size 25M;
        }

        # Health Check Endpoint
        location /healthz {
            access_log off;
            return 200 '{"status":"UP","ingress":"nginx-tls1.3"}\n';
            add_header Content-Type application/json;
        }
    }
}
